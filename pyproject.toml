[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "freightflow"
version = "0.1.0"
description = "Cross-distributor freight coordination and settlement layer built on MultiFlow"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "TheBabelDragon" },
]
keywords = ["freight", "logistics", "allocation", "settlement", "multiflow"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/freightflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
